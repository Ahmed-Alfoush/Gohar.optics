<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Digital Business Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ═══════════ تصميم الكارت (لا تحتاج تعديله عادة — الألوان من theme في البيانات) ═══════════ */
:root{--bg:#070a18;--bg2:#101535;--gold:#d9b45a;--gold2:#f6e3a1;--gold3:#a87a2c;--txt:#f4efe2;--mut:#a9a8b8;--pur:#7b3fe4;--gold-rgb:217,180,90;--pur-rgb:123,63,228;--orb1:#6d2fd9;--orb2:#d9b45a;--orb3:#1b3cc9;--c1:#251a66;--c2:#0d1230;--c3:#3a2280;--tilt:-20deg;--hk:1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{position:relative;background:radial-gradient(circle at 50% -10%,var(--bg2),var(--bg) 60%) fixed;color:var(--txt);font-family:'Cairo',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.card{position:relative;z-index:1;width:100%;max-width:clamp(320px,94vw,470px);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:clamp(22px,5vh,40px) clamp(16px,5vw,26px) clamp(24px,5vh,40px);text-align:center}
@media(min-width:600px){body{padding:clamp(16px,4vh,48px) 16px}.card{min-height:min(860px,calc(100dvh - 64px));border:1px solid rgba(var(--gold-rgb),.35);border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(var(--pur-rgb),.12)}}
@media(max-height:700px){.logo{width:118px;height:118px;margin-bottom:6px}.bio{margin-bottom:16px}.sec{margin:14px 0 8px}}

/* الخلفية الحيّة */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(50px);will-change:transform;opacity:.5;animation:drift 18s ease-in-out infinite alternate}
.o1{width:360px;height:360px;background:var(--orb1);top:-90px;right:-80px}
.o2{width:320px;height:320px;background:var(--orb2);opacity:.26;bottom:-100px;left:-90px;animation-duration:23s}
.o3{width:260px;height:260px;background:var(--orb3);opacity:.35;top:42%;left:18%;animation-duration:27s}
@keyframes drift{to{transform:translate(70px,-90px) scale(1.25)}}
.pt{position:absolute;bottom:-12px;width:var(--s);height:var(--s);border-radius:50%;background:var(--gold2);box-shadow:0 0 8px var(--gold);opacity:0;animation:rise var(--d) linear infinite var(--dl)}
@keyframes rise{10%{opacity:.85}100%{transform:translate(var(--x),-112vh);opacity:0}}

/* الهوية */
.logo{width:150px;height:150px;margin:0 auto 8px;filter:drop-shadow(0 0 16px rgba(var(--gold-rgb),.55)) drop-shadow(0 0 40px rgba(var(--pur-rgb),.55))}
.logo i{display:block;width:100%;height:100%;background:linear-gradient(115deg,var(--gold3) 0%,var(--gold2) 25%,var(--gold) 45%,#fff3c4 55%,var(--gold3) 75%,var(--gold2) 100%);background-size:250% 100%;animation:shine 5s linear infinite;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
@keyframes shine{to{background-position:-250% 0}}
@keyframes pulse{50%{transform:scale(1.045)}}
h1{font-size:28px;font-weight:800;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.ar{color:var(--txt);font-size:17px;margin-top:2px}
.role{color:var(--gold);font-size:13px;letter-spacing:2.5px;text-transform:uppercase;margin:8px 0 14px}
.bio{color:var(--mut);font-size:14.5px;line-height:1.9;max-width:320px;margin:0 auto 26px}
.gold-line{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 24px;width:70%}

/* الأزرار */
.btn,.lk,.save,.foot{position:relative;overflow:hidden;isolation:isolate}
.save{width:100%;border:0;border-radius:16px;padding:17px;font:800 18px 'Cairo',sans-serif;color:#1a1304;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--gold3));box-shadow:0 8px 24px rgba(var(--gold-rgb),.35);cursor:pointer;margin-bottom:16px;transition:transform .15s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 8px;border-radius:14px;border:1px solid rgba(var(--gold-rgb),.35);background:rgba(255,255,255,.04);color:var(--txt);text-decoration:none;font:600 15px 'Cairo',sans-serif;cursor:pointer;transition:.15s}
.btn svg{width:20px;height:20px;fill:var(--gold);flex:none}
.wide{grid-column:1/-1}
.sec{color:var(--gold);font-size:13px;letter-spacing:1px;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec:before,.sec:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--gold-rgb),.5))}
.sec:after{transform:scaleX(-1)}
.links{display:flex;flex-direction:column;gap:10px}
.lk{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 16px;border-radius:16px;border:1px solid rgba(var(--gold-rgb),.3);background:rgba(255,255,255,.04);color:var(--txt);text-decoration:none;font:600 16px 'Cairo',sans-serif;text-align:start;transition:.15s}
.lk i{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.lk i svg{width:26px;height:26px;fill:#fff}
.lk i.lt{width:122px;height:52px;background:#fff;padding:5px 8px}
.lk i.lt img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lk span{flex:1}
.lk em{color:var(--gold);font-style:normal;font-size:20px}
.btn:active,.lk:active,.save:active{transform:scale(.95)!important;box-shadow:0 0 22px rgba(var(--gold-rgb),.5)}
.btn:active,.lk:active{background:rgba(var(--gold-rgb),.18)}
.save:active{filter:brightness(1.1)}

/* حركة الظهور (نفس المدة والنمط لكل العناصر) */
.rv{opacity:0;transform:translateY(26px) scale(.95);filter:blur(6px)}
.rv.in{animation:rv .75s cubic-bezier(.2,.85,.25,1) forwards}
@keyframes rv{to{opacity:1;transform:none;filter:none}}
.logo.rv{transform:scale(.6);filter:drop-shadow(0 0 16px rgba(var(--gold-rgb),.55)) drop-shadow(0 0 40px rgba(var(--pur-rgb),.55))}
.logo.rv.in{animation:rvl .9s cubic-bezier(.2,.85,.25,1) forwards,pulse 4.5s ease-in-out 1.2s infinite}
@keyframes rvl{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}

/* حركة الضغط */
.rip{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(var(--gold-rgb),.6),rgba(var(--gold-rgb),.22) 60%,transparent 70%);transform:scale(0);opacity:1;pointer-events:none;animation:ripple .65s ease-out forwards;z-index:-1}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.spark{position:fixed;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--gold2);box-shadow:0 0 10px var(--gold),0 0 18px rgba(var(--pur-rgb),.7);pointer-events:none;z-index:50;animation:spark .75s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}

/* زرار الكارت (9:5.5 مايل ويتحرك) + موجات NFC */
.cwrap{--cw:clamp(188px,56vw,232px);height:calc(var(--cw)*var(--hk));margin:8px 0 56px;display:flex;align-items:center;justify-content:center;perspective:900px}
.foot{width:var(--cw);aspect-ratio:9/5.5;border-radius:calc(var(--cw)*.07);border:1.5px solid rgba(var(--gold-rgb),.8);background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 52%,var(--c3) 100%);color:var(--gold2);display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 14px 28px rgba(0,0,0,.5),0 0 26px rgba(var(--pur-rgb),.32);transform:rotate(var(--tilt));animation:cardfloat 7s ease-in-out infinite;will-change:transform;backface-visibility:hidden}
@keyframes cardfloat{0%,100%{transform:rotate(var(--tilt)) rotateY(0deg) translateY(0)}33%{transform:rotate(calc(var(--tilt) + 3deg)) rotateY(11deg) translateY(-8px)}66%{transform:rotate(calc(var(--tilt) - 3deg)) rotateY(-11deg) translateY(-12px)}}
.foot:before{content:'';position:absolute;top:0;bottom:0;left:0;width:34%;background:linear-gradient(100deg,transparent,rgba(var(--gold-rgb),.3),transparent);transform:translateX(-220%) skewX(-20deg);animation:sweep 3.6s ease-in-out 1.4s infinite;pointer-events:none;z-index:1;will-change:transform}
@keyframes sweep{0%{transform:translateX(-220%) skewX(-20deg)}55%,100%{transform:translateX(420%) skewX(-20deg)}}
.foot:after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 26px rgba(var(--gold-rgb),.45);opacity:.15;animation:glowp 2.8s ease-in-out infinite;z-index:1}
@keyframes glowp{50%{opacity:1}}
.foot .ft{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:calc(var(--cw)*.012);padding-top:calc(var(--cw)*.03)}
.foot .l1,.foot .l3{font-weight:600;font-size:calc(var(--cw)*.072);line-height:1.35;color:var(--txt)}
.foot .l2{font-weight:800;font-size:calc(var(--cw)*.135);line-height:1.15;letter-spacing:.5px;direction:ltr;background:linear-gradient(90deg,var(--gold2),var(--gold),#fff3c4,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 5px rgba(var(--gold-rgb),.5))}
.nfc{position:absolute;top:calc(var(--cw)*.045);left:calc(var(--cw)*.05);width:calc(var(--cw)*.15);height:calc(var(--cw)*.15);color:var(--gold);z-index:2;transition:transform .3s}
.nfc svg{width:100%;height:100%;overflow:visible;transform:scaleX(-1)}
.nw{fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;opacity:.18;animation:wv 1.9s ease-in-out infinite}
.nw2{animation-delay:.25s}.nw3{animation-delay:.5s}
@keyframes wv{0%,100%{opacity:.18}35%{opacity:1}}
.ring{position:absolute;inset:6px;border-radius:50%;border:2px solid var(--gold);opacity:0;animation:ringp 2.6s ease-out infinite}
.ring.r2{animation-delay:1.3s}
@keyframes ringp{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.foot.tap{filter:brightness(1.2) drop-shadow(0 0 18px rgba(var(--gold-rgb),.7))}
.foot.tap .nfc{transform:scale(1.35)}
.foot.tap .nw{animation-duration:.42s;stroke-width:4.5}
.foot.tap .ring{animation-duration:.75s;border-width:3px}

@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;filter:none}.rv.in,.orb,.pt,.logo,.logo i,.foot,.foot:before,.foot:after,.nw,.ring{animation:none}.nw{opacity:1}}

/* ═══ نسخة الخلفية البيضاء ═══ */
html{color-scheme:light}
body{background:radial-gradient(circle at 50% -10%,var(--bg2),#fff 62%) fixed}
.card{background:transparent}
@media(min-width:600px){.card{background:#fff;border-color:rgba(var(--gold-rgb),.3);box-shadow:0 20px 60px rgba(35,114,114,.15),0 0 40px rgba(var(--pur-rgb),.08)}}
.orb{opacity:.16}.o2{opacity:.14}.o3{opacity:.16}
.pt{background:var(--gold2);box-shadow:0 0 8px var(--gold)}
.logo{width:min(260px,72vw);height:auto;margin:0 auto 10px;filter:none}
.logo img{display:block;width:100%;height:auto}
.logo.rv{filter:none}
@media(max-height:700px){.logo{width:180px;height:auto}}
h1{background:linear-gradient(90deg,var(--gold),var(--pur),var(--gold));-webkit-background-clip:text;background-clip:text}
.ar{color:var(--txt);font-weight:600}
.role{color:var(--pur)}
.gold-line{background:linear-gradient(90deg,transparent,var(--pur),var(--gold),transparent)}
.save{color:#fff;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--gold3));box-shadow:0 8px 24px rgba(var(--gold-rgb),.35)}
.btn,.lk{background:#fff;box-shadow:0 2px 10px rgba(35,114,114,.08)}
.btn:active,.lk:active{background:rgba(var(--gold-rgb),.12)}
.sec{color:var(--pur)}
.lk i.lt{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.foot{color:#fff;border-color:rgba(255,255,255,.75)}
.foot .l1,.foot .l3{color:#fff}
.foot .l2{background:linear-gradient(90deg,#fff,#ffd9da,#fff);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 5px rgba(0,0,0,.25))}
.nfc{color:#fff}.ring{border-color:#fff}
.foot:before{background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent)}
.foot:after{box-shadow:inset 0 0 26px rgba(255,255,255,.4)}
.foot{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 14px 28px rgba(35,114,114,.35),0 0 26px rgba(var(--pur-rgb),.28)}

.logo{width:min(340px,88vw);margin:0 auto 12px}
@media(max-height:700px){.logo{width:240px}}
.bio{color:var(--gold);font-weight:600;font-size:16px}
.card{transition:filter 1.4s ease}
.card.blurred{filter:blur(14px)}
html.intro,html.intro body{overflow:hidden}
#intro{position:fixed;inset:0;z-index:100;overflow:hidden;background:#000;transition:opacity 1s ease .1s}
#intro.out{opacity:0;pointer-events:none}
#intro .vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#intro .v2{opacity:0}#intro .v2.on{opacity:1}
#intro .flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:3;pointer-events:none;transition:opacity .6s ease}
#intro.white .flash{opacity:1}
#intro .say{position:absolute;top:11vh;left:0;right:0;text-align:center;z-index:5;font:800 clamp(32px,9.5vw,46px) 'Cairo',sans-serif;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.65);opacity:0;transform:translateY(14px) scale(.96);transition:opacity .9s ease,transform .9s ease;pointer-events:none}
#intro.extend .say{opacity:1;transform:none}
#intro.open .say{opacity:0;transition-duration:.4s}
#intro .hot{position:absolute;z-index:4;left:50%;top:69%;width:92vw;max-width:480px;height:min(40vw,190px);transform:translate(-50%,-50%);border:0;background:none;display:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#intro .hot:after{content:'';position:absolute;inset:-6px;border:2px solid rgba(255,255,255,.85);border-radius:46px;animation:ringg 1.5s ease-out infinite}
@keyframes ringg{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.12);opacity:0}}
#intro.ready:not(.open) .hot{display:block}
#intro .hint{position:absolute;bottom:9vh;left:0;right:0;text-align:center;z-index:5;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);font:600 16px 'Cairo',sans-serif;opacity:0;transition:opacity .6s;pointer-events:none}
#intro.ready .hint{opacity:1;animation:hint 1.4s ease-in-out infinite}
#intro.open .hint{opacity:0;animation:none}
@keyframes hint{50%{transform:translateY(-5px)}}
#intro .skip{position:absolute;z-index:6;left:14px;top:calc(env(safe-area-inset-top,0px) + 14px);border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;border-radius:20px;padding:6px 14px;font:600 13px 'Cairo',sans-serif;cursor:pointer}
</style>
</head>

  const grid = document.createElement('div'); grid.className = 'grid';
  const gbtn = (cls, href, d, label, extra) => { const n = add('<a class="btn ' + cls + '" ' + (extra || '') + ' href="' + esc(href) + '">' + SVG(d) + esc(label) + '</a>'); grid.appendChild(n); nodes.push(n); };
  gbtn('', 'tel:' + C.contact.phone, P_CALL, C.text.call);
  gbtn('', 'https://wa.me/' + digits + '?text=' + encodeURIComponent(C.contact.whatsappText || ''), P_WA, C.text.whatsapp, 'target="_blank" rel="noopener"');
  if (C.contact.maps) gbtn('wide', C.contact.maps, P_MAP, C.text.maps, 'target="_blank" rel="noopener"');
  card.appendChild(grid);

  const urls = [];
  (C.sections || []).forEach(sec => {
    push(add('<div class="sec">' + esc(sec.title) + '</div>'));
    const box = document.createElement('div'); box.className = 'links'; card.appendChild(box);
    (sec.items || []).forEach(it => {
      if (!it.url) return;
      const ic = it.icon || ICON[it.type] || ICON.link, img = it.logo && A.logos && A.logos[it.logo];
      const tile = img ? '<i class="lt"><img alt="" src="' + img + '"></i>' : '<i style="background:' + ic.bg + '">' + SVG(ic.d) + '</i>';
      const n = add('<a class="lk" href="' + esc(it.url) + '" target="_blank" rel="noopener">' + tile + '<span>' + esc(it.label) + '</span><em>‹</em></a>');
      box.appendChild(n); nodes.push(n); urls.push([it.label, it.url]);
    });
  });

  if (C.cta) {
    const w = push(add('<div class="cwrap"><a class="foot" id="cardCta" href="https://wa.me/' + cdigits + '?text=' + encodeURIComponent(C.cta.whatsappText || '') + '"><span class="nfc"><i class="ring"></i><i class="ring r2"></i><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="38" cy="24" r="3.6" fill="currentColor"/><path class="nw nw1" d="M30 17Q25 24 30 31"/><path class="nw nw2" d="M23 11Q14 24 23 37"/><path class="nw nw3" d="M16 6Q4 24 16 42"/></svg></span><span class="ft"><span class="l1">' + esc(C.cta.line1) + '</span><span class="l2">' + esc(C.cta.line2) + '</span><span class="l3">' + esc(C.cta.line3) + '</span></span></a></div>'));
  }

  /* ---- الخلفية ---- */
  const bg = $('bg');
  if (E.orbs) bg.innerHTML = '<b class="orb o1"></b><b class="orb o2"></b><b class="orb o3"></b>';
  if (E.particles > 0 && !reduce) {
    for (let i = 0; i < E.particles; i++) {
      const e = document.createElement('span'); e.className = 'pt';
      e.style.cssText = 'left:' + Math.random() * 100 + '%;--s:' + (2 + Math.random() * 4) + 'px;--d:' + (9 + Math.random() * 10) + 's;--dl:-' + Math.random() * 14 + 's;--x:' + (Math.random() * 80 - 40) + 'px';
      bg.appendChild(e);
    }
  }

  /* ---- حفظ جهة الاتصال ---- */
  const fold = l => l.replace(/(.{74})/g, '$1\r\n ').replace(/\r\n $/, '');
  function vcard() {
    const B = C.brand, K = C.contact;
    const L = ['BEGIN:VCARD', 'VERSION:3.0', 'N:;' + B.name + ';;;', 'FN:' + B.name, 'ORG:' + B.name, 'TITLE:' + (B.title || ''),
      'TEL;TYPE=CELL,VOICE,PREF:' + K.phone, 'TEL;TYPE=CELL;waid=' + digits + ':' + K.phone,
      K.email ? 'EMAIL;TYPE=INTERNET:' + K.email : '', 'NOTE:' + (B.title || '') + ' - WhatsApp: ' + K.phone];
    let n = 1; const u = (lab, url) => { if (url) { L.push('item' + n + '.URL:' + url, 'item' + n + '.X-ABLabel:' + lab); n++; } };
    u('WhatsApp', 'https://wa.me/' + digits); u('Google Maps', K.maps); urls.forEach(x => u(x[0], x[1])); u('Digital Card', K.cardUrl);
    if (A.contactPhoto) L.push('PHOTO;ENCODING=b;TYPE=JPEG:' + A.contactPhoto);
    L.push('END:VCARD');
    return L.filter(Boolean).map(fold).join('\r\n') + '\r\n';
  }
  function download(text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/vcard;charset=utf-8' }));
    a.download = C.brand.name.replace(/\s+/g, '-') + '.vcf';
    document.body.appendChild(a); a.click(); a.remove();
  }
  function saveContact() {
    const ua = navigator.userAgent, q = encodeURIComponent;
    if (/Android/i.test(ua)) {
      let left = false; const gone = () => { left = true; };
      document.addEventListener('visibilitychange', gone, { once: true });
      addEventListener('pagehide', gone, { once: true }); addEventListener('blur', gone, { once: true });
      location.href = 'intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact'
        + ';S.name=' + q(C.brand.name) + ';S.company=' + q(C.brand.name) + ';S.job_title=' + q(C.brand.title || '')
        + ';S.phone=' + q(C.contact.phone) + (C.contact.email ? ';S.email=' + q(C.contact.email) : '')
        + ';S.notes=' + q('WhatsApp: https://wa.me/' + digits) + ';end';
      setTimeout(() => { if (!left && !document.hidden) download(vcard()); }, 1700);
    } else if (/iPhone|iPad|iPod/i.test(ua)) {
      location.href = URL.createObjectURL(new Blob([vcard()], { type: 'text/x-vcard;charset=utf-8' }));
    } else download(vcard());
  }
  saveBtn.onclick = saveContact;

  /* ---- زرار الكارت: موجات NFC ثم واتساب ---- */
  const cta = $('cardCta');
  if (cta) cta.addEventListener('click', e => {
    e.preventDefault(); if (cta.classList.contains('tap')) return;
    cta.classList.add('tap');
    setTimeout(() => { location.href = cta.href; setTimeout(() => cta.classList.remove('tap'), 1500); }, 950);
  });

  /* ---- حركة الضغط ---- */
  if (E.clickSparks && !reduce) document.addEventListener('pointerdown', e => {
    const t = e.target.closest('.btn,.lk,.save,.foot'); if (!t || t.closest('.lk') && t.querySelector('.lt')) return;
    const r = t.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2;
    const rp = document.createElement('span'); rp.className = 'rip';
    rp.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (e.clientX - r.left - d / 2) + 'px;top:' + (e.clientY - r.top - d / 2) + 'px';
    t.appendChild(rp); setTimeout(() => rp.remove(), 700);
    for (let i = 0; i < 9; i++) {
      const a = Math.PI * 2 * i / 9 + Math.random() * .5, m = 34 + Math.random() * 40, sp = document.createElement('span');
      sp.className = 'spark'; sp.style.cssText = 'left:' + e.clientX + 'px;top:' + e.clientY + 'px;--dx:' + Math.cos(a) * m + 'px;--dy:' + Math.sin(a) * m + 'px';
      document.body.appendChild(sp); setTimeout(() => sp.remove(), 800);
    }
  }, { passive: true });

  /* ---- الظهور + التمرير التلقائي ----
     خط ظهور وهمي بينزل في الصفحة كلها بسرعة ثابتة (E.speed)، وكل عنصر بيظهر لما الخط يعدّي عليه.
     والتمرير بيتبع الخط بسلاسة، فالإيقاع واحد من أول الصفحة لآخرها. */
  const reveal = n => n.classList.add('in');
  if (!E.reveal || reduce) { nodes.forEach(reveal); return; }
  try { history.scrollRestoration = 'manual'; } catch (_) {}
  scrollTo(0, 0);
  let stopped = false; const halt = () => { stopped = true; };
  const armHalt = () => ['touchstart', 'wheel', 'mousedown', 'keydown'].forEach(ev => addEventListener(ev, halt, { once: true, passive: true }));
  const docTop = el => { let y = 0; while (el) { y += el.offsetTop; el = el.offsetParent; } return y; };
  const docH = () => document.documentElement.scrollHeight, maxS = () => Math.max(0, docH() - innerHeight);
  const V = E.speed, RAMP = .5;
  const prof = (D, t) => {                       /* مسافة بعد t ثانية: تسارع ← سرعة ثابتة ← تباطؤ */
    if (t <= 0) return 0;
    const k = Math.min(RAMP, D / V), dr = V * k / 2, cr = Math.max(0, D - 2 * dr), tc = cr / V;
    if (t < k) return V * t * t / (2 * k);
    if (t < k + tc) return dr + V * (t - k);
    const u = t - k - tc; return u < k ? dr + cr + V * u - V * u * u / (2 * k) : D;
  };
  const pending = nodes.slice();
  let t0 = performance.now() + 150, last = performance.now(), cur = 0, phase = 0, holdAt = 0, backAt = 0, from = 0;
  const tick = now => {
    const dt = Math.min(now - last, 50); last = now;
    const D = docH(), line = prof(D, (now - t0) / 1000);
    for (let i = pending.length - 1; i >= 0; i--) if (line >= docTop(pending[i]) + 6) { reveal(pending[i]); pending.splice(i, 1); }
    let moving = false;
    if (!stopped && E.autoScroll && maxS() > 40) {
      if (phase === 0) {
        cur += (Math.min(maxS(), Math.max(0, line - (innerHeight - 110))) - cur) * (1 - Math.exp(-dt / 170)); scrollTo(0, cur);
        if (line >= D - 1 && !pending.length && maxS() - cur < 1.5) { phase = 1; holdAt = now; }
        moving = true;
      } else if (phase === 1) {
        if (now - holdAt > E.hold) { if (E.returnToTop) { phase = 2; backAt = now; from = cur; } else phase = 3; }
        moving = phase !== 3;
      } else if (phase === 2) {
        const d = prof(from, (now - backAt) / 1000); cur = from - d; scrollTo(0, cur);
        if (d >= from - .5) { phase = 3; scrollTo(0, 0); } else moving = true;
      }
    }
    if (pending.length || moving) requestAnimationFrame(tick);
  };
  window.startCard = () => { t0 = performance.now() + 150; last = performance.now(); armHalt(); requestAnimationFrame(tick); };
})();
</script>
<script>
(function(){
  const ov=document.getElementById('intro'),de=document.documentElement,card=document.getElementById('card');
  const go=()=>window.startCard&&window.startCard();
  if(!ov)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ov.remove();go();return;}
  de.classList.add('intro');card.classList.add('blurred');
  let done=false,ready=false;const tm=[],at=(ms,f)=>tm.push(setTimeout(f,ms));
  const v1=ov.querySelector('.v1'),v2=ov.querySelector('.v2'),hot=ov.querySelector('.hot');
  const finish=()=>{if(done)return;done=true;tm.forEach(clearTimeout);ov.classList.add('out');de.classList.remove('intro');card.classList.remove('blurred');scrollTo(0,0);go();setTimeout(()=>{v1.pause();v2.pause();ov.remove()},1300);};
  ov.querySelector('.skip').addEventListener('click',finish);
  const show=()=>{if(ready)return;ready=true;ov.classList.add('extend','ready');};
  v1.addEventListener('timeupdate',()=>{if(v1.duration&&v1.currentTime>v1.duration-1.6)show();});
  v1.addEventListener('ended',show);
  v1.addEventListener('error',finish);
  const p=v1.play();if(p&&p.catch)p.catch(finish);
  at(6000,()=>{if(v1.currentTime===0)finish();});
  hot.addEventListener('click',()=>{
    if(!ready||ov.classList.contains('open'))return;
    ov.classList.add('open');v2.classList.add('on');
    const q=v2.play();if(q&&q.catch)q.catch(finish);
    v2.addEventListener('timeupdate',()=>{if(v2.duration&&v2.currentTime>v2.duration-0.7)ov.classList.add('white');});
    v2.addEventListener('ended',finish);v2.addEventListener('error',finish);
    at(12000,finish);
  });
})();
</script>
